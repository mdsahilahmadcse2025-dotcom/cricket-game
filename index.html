<!DOCTYPE html>
<html>
<head>
    <title>Mini Cricket Game</title>
    <style>
        body{
            text-align:center;
            font-family:Arial;
            background:#0f172a;
            color:white;
        }

        .container{
            margin-top:50px;
        }

        button{
            padding:12px 20px;
            margin:10px;
            font-size:18px;
            cursor:pointer;
            border:none;
            border-radius:10px;
        }

        .run{
            background:#22c55e;
            color:white;
        }

        .reset{
            background:#ef4444;
            color:white;
        }

        h1{
            color:#38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏏 Mini Cricket Game</h1>

    <h2>Score: <span id="score">0</span></h2>
    <h2>Wickets: <span id="wickets">0</span>/3</h2>

    <button class="run" onclick="play()">Play Ball</button>
    <button class="reset" onclick="resetGame()">Reset</button>

    <p id="result"></p>
</div>

<script>
let score = 0;
let wickets = 0;

function play(){
    if(wickets >= 3){
        document.getElementById("result").innerHTML =
        "Game Over! Final Score: " + score;
        return;
    }

    let outcomes = [0,1,2,3,4,6,"W"];
    let ball = outcomes[Math.floor(Math.random()*outcomes.length)];

    if(ball === "W"){
        wickets++;
        document.getElementById("result").innerHTML =
        "❌ OUT!";
    }else{
        score += ball;
        document.getElementById("result").innerHTML =
        "🏏 You scored " + ball + " runs!";
    }

    document.getElementById("score").innerHTML = score;
    document.getElementById("wickets").innerHTML = wickets;
}

function resetGame(){
    score = 0;
    wickets = 0;

    document.getElementById("score").innerHTML = 0;
    document.getElementById("wickets").innerHTML = 0;
    document.getElementById("result").innerHTML = "";
}
</script>

</body>
</html>
